<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wavemaker Cards Novel Writing Software : Github Pages Site</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Minimal button styles to replace Bootstrap */
    .btn {
      display: block;
      width: 100%;
      padding: 0.5rem 1rem;
      margin: 0.5rem 0;
      font-size: 1rem;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #007bff;
      color: #fff;
    }
    .btn-primary:hover {
      background: #0056b3;
    }
    .btn-secondary {
      background: #6c757d;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #495057;
    }
    .btn-lg {
      font-size: 1.25rem;
      padding: 0.75rem 1.25rem;
    }
    .btn-sm, .btn-xs {
      font-size: 0.85rem;
      padding: 0.25rem 0.5rem;
    }
  </style>
</head>
<body class="text-center">
  <div class="centerbox">
    <img src="assets/wavemaker.svg" width="100" alt="Wavemaker logo">
    <h1>wavemaker</h1>
    <h5>Novel Writing Software</h5>

  <a href="https://wavemakercards.github.io/wavemaker-v4/" class="btn btn-primary btn-lg btn-block">Version 4</a>
    <a href="https://wavemakercards.github.io/wavemaker-v3/" class="btn btn-xs btn-sm btn-block btn-secondary">Version 3</a>
          <a href="https://wavemakercards.github.io/wavemaker-v2/" class="btn btn-xs btn-sm btn-block btn-secondary">Version 2</a>
      
    <div class="foot">
      <a href="https://github.com/wavemakercards" target="_blank" style="display: flex; align-items: center; justify-content: center; gap: 0.5em; color: #ccc; text-decoration: none;">
        <img src="assets/github.svg" alt="GitHub" style="width: 22px; height: 22px; vertical-align: middle; filter: invert(0.8);"> 
        <span>GitHub: wavemakercards</span>
      </a>
    </div>
  </div>
</body>
</html>
